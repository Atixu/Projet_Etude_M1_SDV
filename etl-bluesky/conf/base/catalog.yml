# =============================================================================
# Pipeline nlp_cleaning — datasets Bluesky fake news
# =============================================================================

# Étape 1 : Posts bruts extraits de MongoDB (en mémoire, pas persisté sur disque)
raw_posts_df:
  type: pandas.ParquetDataset
  filepath: data/01_raw/raw_posts.parquet

# Étape 2 : Après suppression URLs, mentions, hashtags
cleaned_posts_df:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/cleaned_posts.parquet

# Étape 3 : Après filtre de langue (anglais uniquement)
lang_filtered_df:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/lang_filtered.parquet

# Étape 4 : Après normalisation (minuscules, ASCII, suppression accents)
normalized_posts_df:
  type: pandas.ParquetDataset
  filepath: data/03_primary/normalized_posts.parquet

# Étape 5 : Après tokenisation (colonne tokens + token_count)
tokenized_posts_df:
  type: pandas.ParquetDataset
  filepath: data/04_feature/tokenized_posts.parquet

# Étape 6 : Après lemmatisation (colonne lemmatized_tokens + clean_text)
lemmatized_posts_df:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/lemmatized_posts.parquet

# Étape 7 : Résumé du chargement MongoDB
nlp_pipeline_summary:
  type: pandas.CSVDataset
  filepath: data/08_reporting/nlp_pipeline_summary.csv
