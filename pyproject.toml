[project]
name = "Projet_Etude_M1_SDV"
version = "0.1.0"
description = "Un projet Python basique"
authors = [
    { name = "Guillaume Reault", email = "guillaume@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"

# Dépendances du projet
dependencies = [
    "requests>=2.31.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.5.0",
    "datasets>=4.8.0",
    "joblib>=1.4.0",
    "vaderSentiment>=3.3.2",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "groq>=0.9.0",
    "codecarbon>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"